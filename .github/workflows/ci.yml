name: CI/CD Pipeline

# Run this workflow on every push and every pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------
  # JOB 1: Run the app's tests
  # -----------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  # -----------------------------------------------------
  # JOB 2: Scan code for accidentally committed secrets
  # -----------------------------------------------------
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------
  # JOB 3: Build the Docker image and scan it for
  # known vulnerabilities before it's considered "safe"
  # -----------------------------------------------------
  build-and-scan:
    name: Build & scan Docker image
    runs-on: ubuntu-latest
    needs: [test, secret-scan]  # only run this if tests + secret scan pass
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-api:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "task-api:${{ github.sha }}"
          format: "table"
          exit-code: "0"        # set to "1" later to fail the build on findings
          severity: "CRITICAL,HIGH"
